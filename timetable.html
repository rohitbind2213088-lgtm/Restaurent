<!DOCTYPE html>
<html>

<head>
    <title>Conference Schedule</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th,
        td {
            border: 2px solid gray;
            padding: 20px;
            background-color: cyan;
            font-size: 22px;
            font-weight: bold;
            height: 150px;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th>Time Slot</th>
            <th colspan="2">Day 1</th>
            <th colspan="2">Day 2</th>
        </tr>

        <tr>
            <td>7:00 AM</td>
            <td>session 1</td>
            <td>session 2</td>
            <td>session 3</td>
            <td>session 4</td>
        </tr>

        <tr>
            <td>9:00 AM</td>
            <td>keynote</td>
            <td>workshop</td>
            <td>palen</td>
            <td>networking</td>
        </tr>
    </table>

</body>

</html>
